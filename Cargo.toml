[package]
name = "payments-engine"
version = "1.0.0"
edition = "2024"
description = "A small payments engine: transactions CSV in, client accounts CSV out."
publish = false

[dependencies]
csv = "1.4.0"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = "1.12.0"

# Measured on 2 million rows; see "Build profiles" in the README.

[profile.dev]
# `cargo run -- transactions.csv`, the command from the spec, builds this profile. Light
# optimization makes it about 6x faster for the same build time. Debug assertions and overflow
# checks stay on: they don't depend on the optimization level.
opt-level = 1

[profile.release]
# Whole-program optimization: about 12% faster than the default release build, for a few more
# seconds of build time.
lto = "fat"
codegen-units = 1
